name: Publish validated binaries
run-name: Publish ${{ github.event.client_payload.tag }} / ${{ github.event.client_payload.request_id }}
on:
  repository_dispatch:
    types: [validated-release]
permissions:
  contents: write
concurrency:
  group: public-release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate, download and publish approved binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-binaries.py
